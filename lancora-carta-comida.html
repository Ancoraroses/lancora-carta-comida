<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'Àncora · La Carta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1c3454;
    --navy-ink:#16283f;
    --gold:#c8963e;
    --cream:#f5f0e6;
    --linen:#efe7d6;
    --slate:#5b6b7a;
    --hair: rgba(28,52,84,0.18);
    --fs-scale: 1;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--cream); color:var(--navy);
    font-family:'Jost', -apple-system, sans-serif;
    font-size:calc(17px * var(--fs-scale)); line-height:1.55;
    background-image:
      linear-gradient(rgba(27,58,63,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(27,58,63,0.045) 1px, transparent 1px);
    background-size: 34px 34px;
  }
  h1,h2,h3{ font-family:'Playfair Display', Georgia, serif; font-weight:700; }
  a{ color:inherit; }
  .wrap{ max-width:920px; margin:0 auto; padding:0 20px; }

  /* ---------- HERO ---------- */
  .hero{
    position:relative; min-height:56vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(200,150,62,0.10), transparent 60%),
      linear-gradient(180deg, var(--cream) 0%, var(--linen) 100%);
    color:var(--navy); padding:52px 20px 40px;
  }
  .hero .grid-texture{
    position:absolute; inset:0; z-index:0; opacity:0.5;
    background-image:
      linear-gradient(rgba(28,52,84,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(28,52,84,0.05) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .hero .bg-anchor-big{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-48%);
    width:56vh; height:56vh; opacity:0.05; color:var(--navy); z-index:0;
  }
  .hero .stars{ position:absolute; inset:0; z-index:0; }
  .hero .stars .star{ position:absolute; color:var(--gold); opacity:0.55; }
  .hero::before{
    content:''; position:absolute; inset:14px; border:2.5px solid var(--navy);
    border-radius:2px; pointer-events:none; z-index:2;
  }
  .hero::after{
    content:''; position:absolute; inset:20px; border:1px solid var(--gold);
    border-radius:2px; pointer-events:none; z-index:2;
  }
  .hero .illus{ position:absolute; bottom:8%; opacity:0.85; z-index:0; color:var(--navy); }
  .hero .illus-boat{ left:2%; width:min(22vw, 230px); }
  .hero .illus-mountain{ right:0; bottom:6%; width:min(24vw, 270px); opacity:0.55; color:var(--slate); }
  .hero-content{ position:relative; z-index:1; }
  .hero .emblem{
    width:92px; height:92px; margin:0 auto 14px; position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .hero .emblem svg.rope{ position:absolute; inset:0; width:100%; height:100%; color:var(--gold); }
  .hero .emblem svg.anchor-icon{ width:35px; height:35px; color:var(--navy); margin:0; opacity:1; }
  .hero .eyebrow{
    font-family:'Jost',sans-serif; font-size:calc(13px * var(--fs-scale)); letter-spacing:4px; text-transform:uppercase;
    color:var(--gold); margin-bottom:6px; font-weight:600;
  }
  .hero h1{ font-size:calc(clamp(36px, 8vw, 58px) * var(--fs-scale)); letter-spacing:1px; line-height:1; color:var(--navy); }
  .hero .tagline{
    margin-top:10px; font-size:calc(15px * var(--fs-scale)); letter-spacing:1.5px; text-transform:uppercase;
    color:var(--navy); opacity:0.8; font-family:'Jost',sans-serif; font-weight:500;
  }
  .hero .divider-wave{ width:64px; height:11px; margin:14px auto 0; color:var(--gold); opacity:0.9; }

  /* ---------- STICKY CATEGORY NAV ---------- */
  nav.catnav{
    position:sticky; top:0; z-index:20;
    background:rgba(245,240,230,0.94); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--hair);
  }
  nav.catnav .chipsrow{
    display:flex; gap:8px; overflow-x:auto; padding:11px 20px;
    scrollbar-width:none;
  }
  nav.catnav .chipsrow::-webkit-scrollbar{ display:none; }
  nav.catnav .chip{
    flex:none; font-family:'Jost',sans-serif; font-size:calc(12.5px * var(--fs-scale)); font-weight:600;
    letter-spacing:0.4px; color:var(--navy); background:#fff;
    border:1px solid var(--hair); border-radius:999px; padding:7px 14px;
    text-decoration:none; white-space:nowrap; transition:all .15s ease;
  }
  nav.catnav .chip:hover{ border-color:var(--gold); }
  nav.catnav .chip.active{ background:var(--navy); color:var(--cream); border-color:var(--navy); }

  /* ---------- MAIN / CATEGORY SECTIONS ---------- */
  main{ position:relative; padding:8px 0 20px; }
  .category{ padding:38px 0 6px; border-bottom:1px dashed var(--hair); }
  .category:last-child{ border-bottom:none; }
  .cat-head{ display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .cat-head .icon-wrap{
    flex:none; width:44px; height:44px; border-radius:50%; border:1px solid var(--navy);
    display:flex; align-items:center; justify-content:center; background:#fff;
  }
  .cat-head .icon-wrap svg{ width:22px; height:22px; color:var(--navy); }
  .cat-head h2{ font-size:calc(24px * var(--fs-scale)); color:var(--navy); letter-spacing:0.3px; }
  .cat-note{
    font-family:'Jost',sans-serif; font-size:calc(11.5px * var(--fs-scale)); letter-spacing:1.2px; text-transform:uppercase;
    color:var(--gold); margin:2px 0 18px 56px;
  }
  .cat-head + .cat-note{
    font-family:'Playfair Display', Georgia, serif; font-size:calc(26px * var(--fs-scale)); font-weight:700;
    letter-spacing:0.3px; text-transform:none; color:var(--navy);
    background:rgba(200,150,62,0.15); display:inline-block;
    padding:6px 22px; border-radius:30px; margin:10px 0 24px 56px;
  }
  .group-name{
    font-family:'Playfair Display', Georgia, serif; font-weight:700; font-size:calc(17px * var(--fs-scale));
    color:var(--navy); margin:20px 0 4px 56px;
  }
  .group-block:first-of-type .group-name{ margin-top:2px; }
  .items{ display:grid; grid-template-columns:1fr 1fr; gap:2px 34px; margin-top:14px; }
  .item{ padding:9px 0; border-bottom:1px dotted var(--hair); }
  .item-top{ display:flex; align-items:baseline; gap:8px; }
  .item .name{ font-family:'Jost',sans-serif; font-size:calc(14.5px * var(--fs-scale)); color:var(--navy); line-height:1.35; }
  .item .fill{ flex:1 1 auto; }
  .item .price{ font-family:'Jost',sans-serif; font-weight:600; font-size:calc(14.5px * var(--fs-scale)); color:var(--navy); white-space:nowrap; }
  .item .note{ font-style:italic; font-size:calc(12px * var(--fs-scale)); color:var(--slate); margin-top:1px; }
  .item .tag{
    display:inline-block; margin-top:5px; background:var(--gold); color:#fffaf0;
    font-family:'Jost',sans-serif; font-size:calc(10px * var(--fs-scale)); letter-spacing:0.6px; font-weight:600;
    padding:2.5px 9px; border-radius:20px;
  }
  @media (max-width:680px){
    .items{ grid-template-columns:1fr; }
    .cat-note{ margin-left:0; }
  }

  /* ---------- WIDGET FLOTANTE: idiomas + Instagram ---------- */
  .side-widget{
    position:fixed; right:16px; bottom:16px; z-index:30;
    background:var(--navy); border:1px solid var(--gold); border-radius:30px;
    display:flex; align-items:center; gap:2px; padding:6px 8px;
    box-shadow:0 4px 16px rgba(28,52,84,0.28);
  }
  .side-widget .lang-btn{
    font-family:'Jost',sans-serif; font-size:calc(10.5px * var(--fs-scale)); font-weight:600; letter-spacing:0.5px;
    padding:6px 8px; border-radius:16px; border:none; background:none;
    color:var(--cream); cursor:pointer; opacity:0.55; transition:all .15s ease;
  }
  .side-widget .lang-btn:hover{ opacity:1; }
  .side-widget .lang-btn.active{ opacity:1; background:var(--gold); color:var(--navy-ink); }
  .side-widget .sep{ width:1px; height:16px; background:rgba(245,240,230,0.25); margin:0 4px; }
  .side-widget .ig-link{
    display:flex; align-items:center; justify-content:center; width:26px; height:26px;
    color:var(--cream); opacity:0.85; transition:opacity .15s ease;
  }
  .side-widget .ig-link:hover{ opacity:1; color:var(--gold); }
  .side-widget .ig-link svg{ width:17px; height:17px; }
  .side-widget .fontsize-btn{
    font-weight:700; font-size:calc(12.5px * var(--fs-scale)); border:1px solid rgba(245,240,230,0.35);
  }
  .side-widget .fontsize-btn:hover{ border-color:var(--gold); }
  @media (max-width:480px){
    .side-widget{ right:10px; bottom:10px; padding:5px 6px; }
    .side-widget .lang-btn{ padding:5px 6px; font-size:calc(10px * var(--fs-scale)); }
  }

  /* ---------- FOOTER ---------- */
  footer{
    background:var(--navy); color:var(--cream); text-align:center; padding:48px 20px 76px;
    position:relative; overflow:hidden; margin-top:20px;
  }
  footer .anchor-icon{ width:38px; height:38px; opacity:0.85; margin-bottom:14px; color:var(--cream); }
  footer p{ font-size:calc(13px * var(--fs-scale)); letter-spacing:1.3px; text-transform:uppercase; opacity:0.75; line-height:2; }
  footer .price-note{ margin-top:10px; font-size:calc(11.5px * var(--fs-scale)); letter-spacing:0.6px; opacity:0.55; text-transform:none; }

  @media (max-width:640px){
    .hero h1{ font-size:calc(42px * var(--fs-scale)); }
    .cat-head h2{ font-size:calc(21px * var(--fs-scale)); }
  }
</style>
</head>

const SUPPORTED_LANGS = ['ca','es','fr','en','de'];
const LANG_NAMES = { ca:'CA', es:'ES', fr:'FR', en:'EN', de:'DE' };

function detectLang(){
  const nav = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'ca']);
  for(const l of nav){
    const code = l.slice(0,2).toLowerCase();
    if(SUPPORTED_LANGS.includes(code)) return code;
  }
  return 'ca';
}

let LANG = detectLang();
function t(field){ return field ? (field[LANG] || field.ca) : ''; }

function buildChips(){
  const row = document.getElementById('chipsrow');
  row.innerHTML = APP.categories.map(c =>
    `<a class="chip" href="#${c.id}" data-id="${c.id}">${t(c.title)}</a>`
  ).join('');
  row.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      row.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
    });
  });
}

function buildCategories(){
  const renderItem = (i) => `
          <div class="item">
            <div class="item-top">
              <span class="name">${t(i.name)}</span>
              <span class="fill"></span>
              ${i.price ? `<span class="price">${i.price}&nbsp;€</span>` : ''}
            </div>
            ${i.note ? `<div class="note">${t(APP.ui[i.note])}</div>` : ''}
            ${i.tag ? `<div class="tag">${t(APP.ui.specialty)}</div>` : ''}
          </div>
        `;
  const box = document.getElementById('categories');
  box.innerHTML = APP.categories.map(c => `
    <section class="category" id="${c.id}">
      <div class="cat-head">
        <span class="icon-wrap"><svg viewBox="0 0 24 24"><use href="#ic-${c.icon}"/></svg></span>
        <h2>${t(c.title)}</h2>
      </div>
      ${c.note ? `<div class="cat-note">${t(APP.ui[c.note])}</div>` : ''}
      ${c.groups ? c.groups.map(g => `
        <div class="group-block">
          ${g.label ? `<div class="group-name">${t(g.label)}</div>` : ''}
          ${g.note ? `<div class="cat-note">${t(APP.ui[g.note])}</div>` : ''}
          ${g.items.length ? `<div class="items">
            ${g.items.map(renderItem).join('')}
          </div>` : ''}
        </div>
      `).join('') : `
      <div class="items">
        ${c.items.map(renderItem).join('')}
      </div>
      `}
    </section>
  `).join('');
}

const FS_STEPS = [1, 1.15, 1.3, 1.45];
let FONT_SCALE = 1;

function detectAutoFontScale(){
  try{
    const probe = document.createElement('span');
    probe.style.fontSize = 'medium';
    probe.style.position = 'absolute';
    probe.style.visibility = 'hidden';
    probe.style.left = '-9999px';
    document.body.appendChild(probe);
    const measured = parseFloat(getComputedStyle(probe).fontSize);
    document.body.removeChild(probe);
    if(!measured || isNaN(measured)) return 1;
    let ratio = measured / 16;
    if(ratio < 1) ratio = 1;
    if(ratio > 1.4) ratio = 1.4;
    let closest = FS_STEPS[0];
    FS_STEPS.forEach(s => { if(Math.abs(s-ratio) < Math.abs(closest-ratio)) closest = s; });
    return closest;
  }catch(e){ return 1; }
}

function loadFontScale(){
  const saved = localStorage.getItem('lancoraFontScale');
  if(saved){ FONT_SCALE = parseFloat(saved); }
  else{ FONT_SCALE = detectAutoFontScale(); }
  applyFontScale();
}

function applyFontScale(){
  document.documentElement.style.setProperty('--fs-scale', FONT_SCALE);
}

function fontScaleLabel(){
  return 'Tamaño de letra: ' + Math.round(FONT_SCALE*100) + '%. Toca para agrandar.';
}

function buildSideWidget(){
  const box = document.getElementById('sidewidget');
  const langBtns = SUPPORTED_LANGS.map(l =>
    `<button class="lang-btn ${l===LANG?'active':''}" data-lang="${l}">${LANG_NAMES[l]}</button>`
  ).join('');
  box.innerHTML = `
    ${langBtns}
    <div class="sep"></div>
    <button class="lang-btn fontsize-btn" id="fontsizebtn" type="button" aria-label="${fontScaleLabel()}" title="${fontScaleLabel()}">A+</button>
    <div class="sep"></div>
    <a class="ig-link" href="https://instagram.com/ancoraroses" target="_blank" rel="noopener" aria-label="Instagram @ancoraroses">
      <svg viewBox="0 0 24 24"><use href="#ic-instagram"/></svg>
    </a>
  `;
  box.querySelectorAll('.lang-btn:not(.fontsize-btn)').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      LANG = btn.dataset.lang;
      renderAll();
    });
  });
  const fsBtn = box.querySelector('#fontsizebtn');
  if(fsBtn){
    fsBtn.addEventListener('click', ()=>{
      const idx = FS_STEPS.findIndex(s => Math.abs(s-FONT_SCALE) < 0.01);
      FONT_SCALE = FS_STEPS[(idx+1) % FS_STEPS.length];
      localStorage.setItem('lancoraFontScale', FONT_SCALE);
      applyFontScale();
      fsBtn.title = fontScaleLabel();
      fsBtn.setAttribute('aria-label', fontScaleLabel());
    });
  }
}

function updateStaticText(){
  document.getElementById('eyebrow').textContent = t(APP.ui.eyebrow);
  document.getElementById('tagline').textContent = t(APP.ui.tagline);
  document.getElementById('footertext').innerHTML =
    `L'Àncora Bar Restaurant · Roses, Costa Brava<br>${t(APP.ui.footer)}`;
  document.getElementById('pricenote').textContent = t(APP.ui.price_note);
  document.getElementById('allergennote').textContent = t(APP.ui.allergen_note);
  document.documentElement.lang = LANG;
}

let observer;
function setupScrollspy(){
  if(observer) observer.disconnect();
  const sections = APP.categories.map(c => document.getElementById(c.id));
  const chips = document.querySelectorAll('.chip');
  observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const id = entry.target.id;
        chips.forEach(c=> c.classList.toggle('active', c.dataset.id === id));
      }
    });
  }, { rootMargin: '-35% 0px -55% 0px', threshold: 0 });
  sections.forEach(s => s && observer.observe(s));
}

function renderAll(){
  buildChips();
  buildCategories();
  buildSideWidget();
  updateStaticText();
  setupScrollspy();
}

loadFontScale();
renderAll();
</script>
